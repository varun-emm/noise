<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#16181b">
<title>Noise Meter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* A satin-steel instrument: one machined dial with an etched dB scale and a red needle,
     and a machined plate at the foot carrying the digital reading. */
  --steel-1:#3a3e44; --steel-2:#24272b; --steel-3:#16181b;
  --face:#0d0e10; --etch:#ece6da; --etch-dim:#8d8a84;
  --red:#e3342b; --amber:#e9a23b; --green:#5fbf7f;
  --brush:rgba(255,255,255,.05);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;background:var(--steel-3)}
body{
  color:var(--etch);font-family:"Barlow Semi Condensed",-apple-system,sans-serif;
  background:
    repeating-linear-gradient(90deg,var(--brush) 0 1px,transparent 1px 3px),
    radial-gradient(120% 70% at 50% 0%,var(--steel-1),var(--steel-2) 55%,var(--steel-3));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(20px,5vh,44px);
  padding:calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 18px);
}

/* ---------- dial ---------- */
.dial{position:relative;width:min(92vw,58vh,440px);aspect-ratio:1}
.bezel{position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 200deg,#6d727a,#2b2e33 18%,#9aa0a8 33%,#33363b 50%,#80858d 66%,#2a2d31 82%,#6d727a);
  box-shadow:0 18px 40px rgba(0,0,0,.6),0 2px 0 rgba(255,255,255,.08) inset}
.face{position:absolute;inset:4.2%;border-radius:50%;
  background:radial-gradient(circle at 50% 38%,#1c1e22,var(--face) 70%);
  box-shadow:inset 0 6px 18px rgba(0,0,0,.9),inset 0 -2px 0 rgba(255,255,255,.04)}
svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.num{font-family:"Barlow Condensed",sans-serif;font-weight:600;fill:var(--etch);text-anchor:middle;dominant-baseline:central}
.unit{font-family:"Barlow Condensed",sans-serif;font-weight:500;fill:var(--etch-dim);text-anchor:middle;letter-spacing:.18em}
#needle{filter:drop-shadow(0 3px 3px rgba(0,0,0,.7))}
.glass{position:absolute;inset:4.2%;border-radius:50%;pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,.07),transparent 38%)}

/* ---------- plate ---------- */
.plate{position:relative;width:min(92vw,440px);border-radius:14px;padding:14px 20px 12px;text-align:center;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,transparent 1px 2px),
    linear-gradient(180deg,#5b6068,#3a3e44 45%,#2c2f34);
  box-shadow:0 10px 24px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.25),inset 0 -1px 0 rgba(0,0,0,.5)}
.plate::before,.plate::after{content:"";position:absolute;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#c9cdd3,#4a4e55);box-shadow:inset 0 0 0 1px rgba(0,0,0,.4)}
.plate::before{left:12px}.plate::after{right:12px}
.window{display:inline-flex;align-items:baseline;gap:6px;padding:4px 18px 2px;border-radius:8px;
  background:#0b0c0e;box-shadow:inset 0 3px 8px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.15)}
#digital{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:clamp(52px,9vh,76px);line-height:1.05;
  font-variant-numeric:tabular-nums;letter-spacing:.02em;color:var(--etch);min-width:2.2ch;text-align:right;
  text-shadow:0 0 14px rgba(236,230,218,.25);transition:color .4s}
.db{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:20px;color:var(--etch-dim);letter-spacing:.12em}
#status{margin-top:8px;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:15px;letter-spacing:.28em;
  text-transform:uppercase;color:#1a1c1f;text-shadow:0 1px 0 rgba(255,255,255,.25)}

/* mic prompt, only if the browser blocks auto-start */
#gate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(10,11,13,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#gate span{font-family:"Barlow Condensed",sans-serif;font-weight:600;letter-spacing:.24em;text-transform:uppercase;
  font-size:15px;padding:14px 22px;border-radius:999px;color:var(--etch);border:1px solid rgba(236,230,218,.35);text-align:center;max-width:80vw;line-height:1.5}
</style>
</head>
<body>

<div class="dial" aria-hidden="true">
  <div class="bezel"></div>
  <div class="face"></div>
  <svg viewBox="0 0 400 400" id="svg">
    <g id="scale"></g>
    <text class="unit" x="200" y="272" font-size="17">dB</text>
    <path id="peak" d="M0 0" fill="var(--amber)"/>
    <g id="needle">
      <path d="M196.6 214 L198.6 62 Q200 56 201.4 62 L203.4 214 Z" fill="var(--red)"/>
      <path d="M197 214 L197 246 Q200 252 203 246 L203 214 Z" fill="#2a2c30"/>
    </g>
    <circle cx="200" cy="200" r="17" fill="url(#hub)"/>
    <circle cx="200" cy="200" r="5" fill="#0d0e10"/>
    <defs>
      <radialGradient id="hub" cx="40%" cy="35%"><stop offset="0" stop-color="#b9bec5"/><stop offset=".55" stop-color="#555a61"/><stop offset="1" stop-color="#25282c"/></radialGradient>
    </defs>
  </svg>
  <div class="glass"></div>
</div>

<div class="plate" role="status" aria-live="polite">
  <div class="window"><span id="digital">--</span><span class="db">dB</span></div>
  <div id="status">Listening</div>
</div>

<div id="gate"><span id="gateText">Tap to start</span></div>

<script>
(() => {
  const MIN = 30, MAX = 130;          // scale range, dB
  const A0 = -135, A1 = 135;          // needle sweep, degrees (0 = straight up)
  const CAL = 94;                     // dBFS → approximate dB SPL offset for phone mics
  const CX = 200, CY = 200;
  const $ = id => document.getElementById(id);
  const ang = db => A0 + (Math.min(MAX, Math.max(MIN, db)) - MIN) / (MAX - MIN) * (A1 - A0);
  const pt = (a, r) => { const t = (a - 90) * Math.PI / 180; return [CX + r * Math.cos(t), CY + r * Math.sin(t)]; };

  /* ---------- etch the scale ---------- */
  const NS = 'http://www.w3.org/2000/svg';
  const g = $('scale');
  const el = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); g.appendChild(e); return e; };
  const arc = (d0, d1, r, w, color) => {
    const a0 = ang(d0), a1 = ang(d1), [x0, y0] = pt(a0, r), [x1, y1] = pt(a1, r);
    el('path', { d: `M${x0} ${y0} A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1} ${y1}`, fill: 'none', stroke: color, 'stroke-width': w, 'stroke-linecap': 'butt' });
  };
  arc(70, 85, 163, 7, 'var(--amber)');
  arc(85, MAX, 163, 7, 'var(--red)');
  for (let d = MIN; d <= MAX; d += 2) {
    const major = d % 10 === 0, mid = d % 10 === 5 && !major;
    const a = ang(d), r0 = major ? 146 : mid ? 152 : 156, [x0, y0] = pt(a, r0), [x1, y1] = pt(a, 168);
    el('line', { x1: x0, y1: y0, x2: x1, y2: y1, stroke: d >= 85 ? 'var(--red)' : 'var(--etch)', 'stroke-width': major ? 3.2 : mid ? 2 : 1.2, opacity: major ? 1 : .75 });
    if (major) {
      const [tx, ty] = pt(a, 124);
      const t = el('text', { x: tx, y: ty, class: 'num', 'font-size': 24 });
      t.textContent = d;
      if (d >= 90) t.setAttribute('fill', 'var(--red)');
    }
  }

  /* ---------- reading ---------- */
  const LEVELS = [
    [40, 'Quiet', 'var(--etch)'], [55, 'Calm', 'var(--etch)'], [70, 'Moderate', 'var(--etch)'],
    [85, 'Loud', 'var(--amber)'], [100, 'Harmful', 'var(--red)'], [999, 'Dangerous', 'var(--red)']
  ];
  let ctx, analyser, stream, buf, raf, live = false, starting = false;
  let target = MIN, shown = MIN, angle = A0, vel = 0, peak = MIN, lastUI = 0, wake = null;

  async function start() {
    if (live || starting) return;
    starting = true;
    try {
      if (!navigator.mediaDevices?.getUserMedia) throw new Error('nomic');
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      const src = ctx.createMediaStreamSource(stream);
      analyser = ctx.createAnalyser(); analyser.fftSize = 2048;
      buf = new Float32Array(analyser.fftSize);
      src.connect(analyser);
      if (ctx.state !== 'running') { try { await ctx.resume(); } catch (e) {} }
      if (ctx.state !== 'running') { gate('Tap to start'); starting = false; return; }
      $('gate').style.display = 'none';
      live = true;
      try { wake = await navigator.wakeLock?.request('screen'); } catch (e) {}
    } catch (e) {
      stop();
      gate(e && e.name === 'NotAllowedError' ? 'Microphone blocked — allow it in browser settings, then tap' : 'Tap to start');
    }
    starting = false;
  }

  function stop() {
    live = false;
    try { stream?.getTracks().forEach(t => t.stop()); } catch (e) {}
    try { ctx?.close(); } catch (e) {}
    try { wake?.release(); } catch (e) {}
    stream = ctx = analyser = wake = null;
    target = MIN;
  }

  function gate(msg) { $('gateText').textContent = msg; $('gate').style.display = 'flex'; }
  $('gate').addEventListener('click', async () => {
    if (ctx && ctx.state !== 'running') {
      try { await ctx.resume(); } catch (e) {}
      if (ctx.state === 'running') { $('gate').style.display = 'none'; live = true; return; }
    }
    stop(); start();
  });

  function sample() {
    analyser.getFloatTimeDomainData(buf);
    let s = 0; for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i];
    const db = 20 * Math.log10(Math.max(Math.sqrt(s / buf.length), 1e-8)) + CAL;
    target = Math.max(0, db);
  }

  /* needle: a damped spring, so it swings and settles like a real gauge */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (live && analyser) sample();
    shown += (target - shown) * Math.min(1, dt * 6);
    const goal = ang(target);
    vel += ((goal - angle) * 120 - vel * 17) * dt;
    angle += vel * dt;
    if (angle < A0) { angle = A0; vel = Math.max(0, vel); }
    if (angle > A1 + 3) { angle = A1 + 3; vel = Math.min(0, vel); }
    $('needle').setAttribute('transform', `rotate(${angle.toFixed(2)} ${CX} ${CY})`);

    if (live && shown > peak) peak = shown;
    if (now - lastUI > 120) {
      lastUI = now;
      if (live) {
        const v = Math.round(shown), lv = LEVELS.find(l => shown < l[0]);
        $('digital').textContent = v;
        $('digital').style.color = lv[2];
        $('status').textContent = lv[1];
        // peak-hold telltale on the outer ring
        const a = ang(peak), [x, y] = pt(a, 176), [l1x, l1y] = pt(a - 2.2, 186), [l2x, l2y] = pt(a + 2.2, 186);
        $('peak').setAttribute('d', `M${x} ${y} L${l1x} ${l1y} L${l2x} ${l2y} Z`);
      }
    }
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);

  /* auto start on open, auto stop when the page is hidden or closed */
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') stop();
    else { peak = MIN; start(); }
  });
  window.addEventListener('pagehide', stop);
  window.addEventListener('pageshow', e => { if (e.persisted) start(); });
  start();
})();
</script>
</body>
</html>
