<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#151618">
<title>Noise Meter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,400;0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"DSEG7";src:url("fonts/DSEG7Classic-BoldItalic.woff2") format("woff2");font-display:block}
:root{
  /* A hi-fi front panel: brushed aluminium, a backlit VU-style window with a swinging needle,
     and a Casio-style LCD beneath it for the numbers. */
  --ink:#1d1c1a; --red:#c8392b; --face-hot:#fff6de; --face:#f1e6c8; --face-edge:#d9c89f;
  --lcd-1:#151a15; --lcd-2:#0c0f0c; --seg:#d9f2c4; --ghost:rgba(217,242,196,.07);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden}
body{
  font-family:"Jost",-apple-system,sans-serif;color:var(--ink);
  background:
    repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,rgba(0,0,0,.12) 1px 2px,transparent 2px 3px),
    linear-gradient(180deg,#2a2c2f 0%,#1c1d20 45%,#121315 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(22px,4.5vh,40px);
  padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 18px);
}
.engrave{font-style:italic;font-weight:600;letter-spacing:.06em;color:#9a9da2;
  text-shadow:0 -1px 0 rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.06)}

/* ---------- meter window ---------- */
.meter{width:min(94vw,460px);display:flex;flex-direction:column;align-items:center;gap:14px}
.frame{position:relative;width:100%;aspect-ratio:400/262;border-radius:10px;padding:12px;
  background:linear-gradient(180deg,#2b2c2e,#121314 60%,#1d1e20);
  box-shadow:0 1px 0 rgba(255,255,255,.1),0 14px 30px rgba(0,0,0,.6),inset 0 2px 3px rgba(0,0,0,.8)}
.window{position:relative;width:100%;height:100%;border-radius:4px;overflow:hidden;
  background:
    radial-gradient(70% 55% at 50% 100%,rgba(255,226,160,.55),transparent 70%),
    radial-gradient(120% 90% at 50% 45%,var(--face-hot),var(--face) 55%,var(--face-edge));
  box-shadow:inset 0 10px 16px -6px rgba(0,0,0,.55),inset 8px 0 14px -8px rgba(0,0,0,.45),inset -8px 0 14px -8px rgba(0,0,0,.45)}
.window svg{position:absolute;inset:0;width:100%;height:100%}
.glass{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,.06) 30%,transparent 31%,transparent 70%,rgba(255,255,255,.08) 71%,transparent 85%)}
.num{font-family:"Jost",sans-serif;font-weight:500;text-anchor:middle;dominant-baseline:central}
#needle{filter:drop-shadow(3px 2px 1.5px rgba(0,0,0,.28))}

/* ---------- LCD ---------- */
.calc{width:min(94vw,460px);border-radius:14px;padding:12px;
  background:linear-gradient(180deg,#303134,#1a1b1d);
  box-shadow:0 1px 0 rgba(255,255,255,.08),0 12px 26px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.1)}
.lcd{border-radius:6px;padding:10px 14px 9px;
  background:linear-gradient(180deg,var(--lcd-1),var(--lcd-2));
  box-shadow:inset 0 3px 10px rgba(0,0,0,.9),inset 0 -1px 0 rgba(255,255,255,.05)}
.reads{display:grid;grid-template-columns:1fr 1px 1fr;gap:12px;align-items:end}
.rule{align-self:stretch;background:rgba(217,242,196,.12)}
.read{display:flex;flex-direction:column;align-items:flex-end}
.tag{align-self:flex-start;font-weight:600;font-size:13px;letter-spacing:.14em;color:var(--seg)}
.digits{position:relative;font-family:"DSEG7",monospace;font-size:clamp(42px,11.5vw,56px);line-height:1.12;color:var(--seg);
  text-shadow:0 0 10px rgba(190,240,160,.35)}
.digits .ghost{position:absolute;right:0;top:0;color:var(--ghost);text-shadow:none}
.digits .val{position:relative}
.u{font-weight:600;font-size:12px;letter-spacing:.12em;color:var(--seg);margin-top:2px}
.flags{display:flex;justify-content:space-between;margin-top:8px;padding-top:6px;border-top:1px solid rgba(217,242,196,.1);
  font-weight:600;font-size:11px;letter-spacing:.1em}
.flags span{color:var(--ghost);transition:color .15s}
.flags span.on{color:var(--seg)}
.flags span.on{text-shadow:0 0 8px rgba(190,240,160,.4)}
.flags span.on.hot{color:#ff6a5c;text-shadow:0 0 8px rgba(255,90,70,.45)}

#gate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#gate span{font-weight:600;letter-spacing:.2em;text-transform:uppercase;font-size:14px;padding:14px 22px;border-radius:999px;
  background:#1f2022;color:#eee;text-align:center;max-width:82vw;line-height:1.5}
</style>
</head>
<body>

<div class="meter" aria-hidden="true">
  <div class="frame">
    <div class="window">
      <svg viewBox="0 0 400 238" id="svg">
        <defs><clipPath id="clip"><rect width="400" height="238"/></clipPath></defs>
        <g id="scale"></g>
        <text x="200" y="168" class="num" font-size="40" font-style="italic" font-weight="600" fill="#2a2926">dB</text>
        <text x="200" y="196" class="num" font-size="9.5" letter-spacing="2.2" fill="#6b6455">SOUND PRESSURE LEVEL</text>
        <g clip-path="url(#clip)">
          <g id="needle">
            <line x1="200" y1="330" x2="200" y2="118" stroke="#1b1a18" stroke-width="2.4" stroke-linecap="round"/>
            <line x1="200" y1="118" x2="200" y2="84" stroke="var(--red)" stroke-width="2.4" stroke-linecap="round"/>
          </g>
        </g>
      </svg>
      <div class="glass"></div>
    </div>
  </div>
  <div class="engrave" style="font-size:15px">SOUND LEVEL</div>
</div>

<div class="calc" role="status" aria-live="polite">
  <div class="lcd">
    <div class="reads">
      <div class="read">
        <span class="tag">NOW</span>
        <div class="digits"><span class="ghost">88.8</span><span class="val" id="now">!!.!</span></div>
        <span class="u">dB</span>
      </div>
      <div class="rule"></div>
      <div class="read">
        <span class="tag">AVG</span>
        <div class="digits"><span class="ghost">88.8</span><span class="val" id="avg">!!.!</span></div>
        <span class="u">dB</span>
      </div>
    </div>
    <div class="flags" id="flags">
      <span>QUIET</span><span>CALM</span><span>MODERATE</span><span>LOUD</span><span>HARMFUL</span>
    </div>
  </div>
</div>

<div id="gate"><span id="gateText">Tap to start</span></div>

<script>
(() => {
  const MIN = 30, MAX = 120;          // scale range, dB
  const SWEEP = 37;                   // needle swing either side of centre, degrees
  const CAL = 94;                     // dBFS → approximate dB SPL offset for phone mics
  const PX = 200, PY = 330;           // pivot sits below the window, like a real VU meter
  const $ = id => document.getElementById(id);
  const ang = db => -SWEEP + (Math.min(MAX, Math.max(MIN, db)) - MIN) / (MAX - MIN) * SWEEP * 2;
  const pt = (a, r) => { const t = a * Math.PI / 180; return [PX + r * Math.sin(t), PY - r * Math.cos(t)]; };

  /* ---------- print the scale ---------- */
  const NS = 'http://www.w3.org/2000/svg', g = $('scale');
  const el = (tag, attrs, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; g.appendChild(e); return e; };
  const arcPath = (d0, d1, r) => { const [x0, y0] = pt(ang(d0), r), [x1, y1] = pt(ang(d1), r); return `M${x0} ${y0} A${r} ${r} 0 0 1 ${x1} ${y1}`; };
  const R = 232, HOT = 85;

  el('path', { d: arcPath(MIN, HOT, R), fill: 'none', stroke: 'var(--ink)', 'stroke-width': 1.6 });
  el('path', { d: arcPath(HOT, MAX, R), fill: 'none', stroke: 'var(--red)', 'stroke-width': 1.6 });
  // band under the arc: hollow for safe, solid red for harmful
  el('path', { d: arcPath(MIN + .6, HOT - .6, R - 12), fill: 'none', stroke: 'var(--ink)', 'stroke-width': 7 });
  el('path', { d: arcPath(MIN + 1.1, HOT - 1.1, R - 12), fill: 'none', stroke: 'var(--face)', 'stroke-width': 4.4 });
  el('path', { d: arcPath(HOT + .6, MAX, R - 12), fill: 'none', stroke: 'var(--red)', 'stroke-width': 7 });

  for (let d = MIN; d <= MAX; d += 2.5) {
    const major = d % 10 === 0, half = d % 5 === 0 && !major;
    const a = ang(d), hot = d >= HOT;
    const [x0, y0] = pt(a, R), [x1, y1] = pt(a, R + (major ? 16 : half ? 10 : 6));
    el('line', { x1: x0, y1: y0, x2: x1, y2: y1, stroke: hot ? 'var(--red)' : 'var(--ink)', 'stroke-width': major ? 3 : half ? 1.6 : .9 });
    if (major) {
      const [tx, ty] = pt(a, R + 33);
      el('text', { x: tx, y: ty, class: 'num', 'font-size': 21, fill: hot ? 'var(--red)' : 'var(--ink)' }, d);
    }
  }
  { const [x, y] = pt(-SWEEP - 6, R + 22); el('text', { x, y, class: 'num', 'font-size': 26, fill: 'var(--ink)' }, '–'); }
  { const [x, y] = pt(SWEEP + 6, R + 22); el('text', { x, y, class: 'num', 'font-size': 26, fill: 'var(--red)' }, '+'); }

  /* ---------- measuring ---------- */
  const BANDS = [40, 55, 70, 85, Infinity];   // QUIET, CALM, MODERATE, LOUD, HARMFUL
  const flags = [...$('flags').children];
  let ctx, analyser, stream, buf, live = false, starting = false, wake = null;
  let level = MIN, shown = MIN, angle = -SWEEP - 3, vel = 0, energy = 0, count = 0, lastUI = 0, lastAvg = 0;

  async function start() {
    if (live || starting) return;
    starting = true;
    try {
      if (!navigator.mediaDevices?.getUserMedia) throw new Error('nomic');
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      const src = ctx.createMediaStreamSource(stream);
      analyser = ctx.createAnalyser(); analyser.fftSize = 2048;
      buf = new Float32Array(analyser.fftSize);
      src.connect(analyser);
      if (ctx.state !== 'running') { try { await ctx.resume(); } catch (e) {} }
      if (ctx.state !== 'running') { gate('Tap to start'); starting = false; return; }
      $('gate').style.display = 'none';
      live = true;
      try { wake = await navigator.wakeLock?.request('screen'); } catch (e) {}
    } catch (e) {
      stop();
      gate(e && e.name === 'NotAllowedError' ? 'Microphone blocked — allow it in browser settings, then tap' : 'Tap to start');
    }
    starting = false;
  }
  function stop() {
    live = false;
    try { stream?.getTracks().forEach(t => t.stop()); } catch (e) {}
    try { ctx?.close(); } catch (e) {}
    try { wake?.release(); } catch (e) {}
    stream = ctx = analyser = wake = null;
    level = MIN - 5;
  }
  function gate(msg) { $('gateText').textContent = msg; $('gate').style.display = 'flex'; }
  $('gate').addEventListener('click', async () => {
    if (ctx && ctx.state !== 'running') {
      try { await ctx.resume(); } catch (e) {}
      if (ctx.state === 'running') { $('gate').style.display = 'none'; live = true; return; }
    }
    stop(); start();
  });

  function sample() {
    analyser.getFloatTimeDomainData(buf);
    let s = 0; for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i];
    level = Math.max(0, 20 * Math.log10(Math.max(Math.sqrt(s / buf.length), 1e-8)) + CAL);
  }
  const fmt = v => (Math.min(199.9, Math.max(0, v))).toFixed(1).padStart(4, '!');  // '!' is a blank cell in DSEG

  /* needle: VU-style ballistics — about 300 ms to settle, with a touch of overshoot */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (live && analyser) sample();
    shown += (level - shown) * Math.min(1, dt * 5);
    const goal = level < MIN ? -SWEEP - 3 : ang(level);
    vel += ((goal - angle) * 140 - vel * 19) * dt;
    angle += vel * dt;
    if (angle < -SWEEP - 3) { angle = -SWEEP - 3; vel = Math.max(0, vel); }
    if (angle > SWEEP + 4) { angle = SWEEP + 4; vel = Math.min(0, vel); }
    $('needle').setAttribute('transform', `rotate(${angle.toFixed(2)} ${PX} ${PY})`);

    if (live && now - lastAvg > 100) { lastAvg = now; energy += Math.pow(10, shown / 10); count++; }
    if (live && now - lastUI > 150) {
      lastUI = now;
      $('now').textContent = fmt(shown);
      if (count) $('avg').textContent = fmt(10 * Math.log10(energy / count));
      const b = BANDS.findIndex(x => shown < x);
      flags.forEach((f, i) => { f.classList.toggle('on', i === b); f.classList.toggle('hot', i === 4); });
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* auto start on open; auto stop when the page is hidden or closed */
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') stop();
    else { energy = 0; count = 0; start(); }
  });
  window.addEventListener('pagehide', stop);
  window.addEventListener('pageshow', e => { if (e.persisted) start(); });
  start();
})();
</script>
</body>
</html>
